databases:
  - name: risk-network-db
    databaseName: risk_network
    user: risk_user
    plan: free

services:
  - type: web
    name: risk-network-api
    env: python
    buildCommand: "./build.sh"
    startCommand: "poetry run gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: risk-network-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
